<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Library | Orion</title>
    <meta name="description" content="Slides, hymnals, and Bibles in a public Orion library. Install it from Settings in the app.">
    <link rel="canonical" href="https://orion.riandre.com/libraries/library.html">
    <meta name="theme-color" content="#000000">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Orion">
    <meta property="og:title" content="Library | Orion">
    <meta property="og:description" content="Slides, hymnals, and Bibles in a public Orion library. Install it from Settings in the app.">
    <meta property="og:url" content="https://orion.riandre.com/libraries/library.html">
    <meta property="og:image" content="https://orion.riandre.com/images/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Orion showing the service order, a slide, a hymn, and a Bible verse">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Library | Orion">
    <meta name="twitter:description" content="Slides, hymnals, and Bibles in a public Orion library. Install it from Settings in the app.">
    <meta name="twitter:image" content="https://orion.riandre.com/images/og.png">
    <link rel="icon" href="../images/icon.png">
    <link rel="apple-touch-icon" href="../images/icon.png">
    <link rel="stylesheet" href="../css/site.css?v=bible">
  </head>
  <body>
    <header class="header">
      <div class="frame header__inner">
        <a class="brand" href="../">
          <img class="wordmark" src="../images/wordmark.png?v=white" alt="Orion">
        </a>
        <nav class="header__nav">
          <a href="./" aria-current="page">Libraries</a>
          <a href="../#download">Download</a>
          <a href="https://github.com/riandredev/orion">Source</a>
        </nav>
      </div>
    </header>

    <main class="page">
      <div class="frame" id="library"></div>
    </main>

    <footer class="footer">
      <div class="frame footer__grid">
        <div>
          <img class="wordmark wordmark--footer" src="../images/wordmark.png?v=white" alt="Orion">
          <p>Presentation software for church services.</p>
        </div>
        <div>
          <a href="../#download">Download</a>
          <a href="../contact/">Contact</a>
          <a data-release="notes" href="https://github.com/riandredev/orion/releases/tag/v1.0.13">Release 1.0.13</a>
          <a href="https://github.com/riandredev/orion">Source code</a>
        </div>
        <div>
          <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0-only</a>
        </div>
      </div>
    </footer>

    <script>
      function escapeText(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char])
      }

      const libraryBase = 'https://raw.githubusercontent.com/riandredev/orion/main/bundles/'

      function asset(path) {
        if (/^https?:\/\//.test(path)) return path
        return `../${encodeURI(path)}`
      }

      function catalogAsset(id, src, version) {
        const path = String(src).split('/').map((part) => encodeURIComponent(part)).join('/')
        return `${libraryBase}${encodeURIComponent(id)}/${path}?v=${encodeURIComponent(version || '')}`
      }

      function fromCatalog(entry) {
        const visuals = []
        const details = []
        for (const group of entry.preview || []) {
          const images = group.images || []
          if (!images.length) {
            if ((group.items || []).length) details.push({ label: group.label, items: group.items })
            continue
          }
          const folders = []
          const loose = []
          for (const image of images) {
            const src = catalogAsset(entry.id, image.src, entry.version)
            const item = { src, alt: image.alt || '' }
            if (!image.folder) {
              loose.push(item)
              continue
            }
            let folder = folders.find((entry) => entry.name === image.folder)
            if (!folder) {
              folder = { name: image.folder, images: [] }
              folders.push(folder)
            }
            folder.images.push(item)
          }
          visuals.push({ label: group.label, folders, images: loose })
        }
        return {
          name: entry.name,
          version: entry.version,
          summary: entry.summary,
          icon: `${libraryBase}${entry.id}/icon.png`,
          visuals,
          details
        }
      }

      function thumbs(images) {
        return `<div class="thumbs">${images.map((image) =>
          `<a href="${escapeText(asset(image.src))}"><img src="${escapeText(asset(image.src))}" alt="${escapeText(image.alt || '')}"></a>`
        ).join('')}</div>`
      }

      function render(library) {
        document.title = `${library.name} | Orion`
        const visuals = (library.visuals || []).map((group) => {
          const folders = (group.folders || []).filter((folder) => (folder.images || []).length)
          const images = group.images || []
          if (!folders.length && !images.length) return ''
          const body = folders.length
            ? folders.map((folder) =>
              `<div class="folder"><h3>${escapeText(folder.name)}</h3>${thumbs(folder.images)}</div>`
            ).join('')
            : thumbs(images)
          return `<section class="shot-group"><h2>${escapeText(group.label)}</h2>${body}</section>`
        }).join('')
        const details = (library.details || []).map((group) =>
          `<section class="detail-group"><h2>${escapeText(group.label)}</h2><ul>${(group.items || []).map((item) =>
            `<li>${escapeText(item)}</li>`
          ).join('')}</ul></section>`
        ).join('')
        document.getElementById('library').innerHTML = `
          <a class="back" href="./">Libraries</a>
          <div class="library-title">
            ${library.icon ? `<img src="${escapeText(asset(library.icon))}" alt="">` : ''}
            <div>
              <h1>${escapeText(library.name)}</h1>
              <p>Version ${escapeText(library.version || '')}</p>
            </div>
          </div>
          <p class="summary">${escapeText(library.summary || '')} Install it from Settings in Orion.</p>
          ${visuals}
          ${details ? `<div class="details">${details}</div>` : ''}
        `
      }

      const id = new URLSearchParams(location.search).get('id')
      fetch(`${libraryBase}catalog.json`)
        .then((response) => response.json())
        .then((data) => {
          const entry = (data.bundles || []).find((item) => item.id === id)
          const library = entry ? fromCatalog(entry) : null
          if (!library) {
            document.getElementById('library').innerHTML = '<p>This library is not in the public list. <a href="./">Back to libraries</a></p>'
            return
          }
          render(library)
        })
        .catch(() => {
          document.getElementById('library').textContent = 'The library could not be loaded.'
        })
    </script>
    <script src="../js/release.js"></script>
  </body>
</html>
